<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打怪 RPG 進階版</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel-2: #263449;
      --text: #f8fafc;
      --muted: #b6c2d1;
      --gold: #fbbf24;
      --green: #22c55e;
      --yellow: #facc15;
      --red: #ef4444;
      --blue: #38bdf8;
      --purple: #a78bfa;
      --wood: #8b5a2b;
      --wood-light: #c0843d;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.18), transparent 24rem),
        radial-gradient(circle at 85% 20%, rgba(167, 139, 250, 0.18), transparent 22rem),
        linear-gradient(135deg, #0f172a, #111827 56%, #1e1b4b);
      background-size: 28px 28px, 28px 28px, auto, auto, auto;
      overflow-x: hidden;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      background: #334155;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px var(--shadow);
      transition: transform 0.14s ease, filter 0.14s ease, opacity 0.14s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .app {
      width: min(1120px, calc(100% - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 3.7rem);
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 5px 0 #0b1020;
    }

    .coin-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 118px;
      justify-content: center;
      border: 2px solid rgba(251, 191, 36, 0.75);
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff7cc;
      background: rgba(120, 72, 10, 0.72);
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08), 0 10px 18px var(--shadow);
    }

    .coin-counter.bump {
      animation: coinBump 0.28s ease;
    }

    .source-badge {
      border: 2px solid rgba(56, 189, 248, 0.45);
      border-radius: 8px;
      padding: 8px 10px;
      color: #dff7ff;
      background: rgba(14, 116, 144, 0.42);
      font-size: 0.92rem;
      font-weight: 900;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .panel {
      border: 2px solid rgba(148, 163, 184, 0.24);
      border-radius: 8px;
      background: rgba(31, 41, 55, 0.86);
      box-shadow: 0 18px 42px var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .loading {
      display: grid;
      place-items: center;
      min-height: 62vh;
      text-align: center;
      gap: 16px;
    }

    .spinner {
      width: 58px;
      height: 58px;
      border: 7px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .battle {
      display: grid;
      gap: 16px;
    }

    .arena {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .fighter {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 270px;
      padding: 16px;
      overflow: hidden;
    }

    .fighter::after {
      content: "";
      position: absolute;
      inset: auto 10% -34px;
      height: 58px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.24);
      filter: blur(3px);
    }

    .fighter-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-weight: 900;
    }

    .sprite {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 150px;
      font-size: clamp(5rem, 15vw, 8.6rem);
      line-height: 1;
      text-shadow: 0 8px 0 rgba(0, 0, 0, 0.22);
      animation: idle 1.8s ease-in-out infinite;
    }

    .monster .sprite {
      animation-delay: 0.35s;
    }

    .hp-wrap {
      position: relative;
      z-index: 1;
    }

    .hp-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 800;
    }

    .hp-bar {
      height: 20px;
      overflow: hidden;
      border: 2px solid #0f172a;
      border-radius: 999px;
      background: #111827;
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.38);
    }

    .hp-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: var(--green);
      transition: width 0.28s ease, background-color 0.18s ease;
    }

    .hp-fill.low {
      background: var(--yellow);
    }

    .hp-fill.critical {
      background: var(--red);
      animation: blink 0.55s ease infinite;
    }

    .question-panel {
      padding: 16px;
    }

    .level-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-weight: 900;
    }

    .question {
      min-height: 86px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(56, 189, 248, 0.34);
      border-radius: 8px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.68);
      font-size: clamp(1.1rem, 2.8vw, 1.75rem);
      font-weight: 900;
      line-height: 1.5;
      text-align: center;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .answer {
      background: #2563eb;
      min-height: 58px;
      text-align: left;
    }

    .answer.correct {
      background: #15803d;
    }

    .answer.wrong {
      background: #b91c1c;
    }

    .message {
      min-height: 42px;
      color: #e0f2fe;
      font-weight: 900;
      text-align: center;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .bag-button {
      background: #7c3aed;
    }

    .flash-green {
      animation: greenFlash 0.2s ease;
    }

    .shake {
      animation: shake 0.3s ease;
    }

    .critical-flash {
      animation: criticalFlash 0.38s ease;
    }

    .critical-text {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 20;
      pointer-events: none;
      color: #fecaca;
      font-size: clamp(3rem, 11vw, 7.6rem);
      font-weight: 1000;
      text-shadow: 0 6px 0 #7f1d1d, 0 0 26px rgba(239, 68, 68, 0.8);
    }

    .critical-text.show {
      display: grid;
      animation: popText 0.72s ease both;
    }

    .shop,
    .overlay {
      display: none;
    }

    .shop.show,
    .overlay.show {
      display: grid;
    }

    .shop {
      gap: 16px;
    }

    .shop-inner {
      padding: 18px;
      border-color: rgba(251, 191, 36, 0.38);
      background:
        linear-gradient(90deg, rgba(91, 51, 19, 0.28), transparent 18%, transparent 82%, rgba(91, 51, 19, 0.28)),
        linear-gradient(135deg, #7c4a22, #a66a32 45%, #6f3f1c);
    }

    .shop-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: #fff4c4;
      font-size: 1.55rem;
      font-weight: 1000;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .item-card {
      min-height: 205px;
      padding: 14px;
      border: 2px solid rgba(255, 244, 196, 0.58);
      border-radius: 8px;
      background: rgba(59, 32, 14, 0.62);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06);
    }

    .item-icon {
      font-size: 2.9rem;
      line-height: 1;
    }

    .item-card h3 {
      margin: 8px 0 6px;
      color: #fff8dc;
      font-size: 1.25rem;
    }

    .item-card p {
      min-height: 54px;
      margin: 0 0 10px;
      color: #fdecc8;
      line-height: 1.55;
    }

    .buy {
      width: 100%;
      background: #b45309;
    }

    .continue {
      background: #16a34a;
    }

    .overlay {
      position: fixed;
      inset: 0;
      place-items: center;
      padding: 22px;
      background: rgba(2, 6, 23, 0.72);
      z-index: 30;
    }

    .dialog {
      width: min(520px, 100%);
      padding: 24px;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      background: #182235;
      box-shadow: 0 24px 58px var(--shadow);
    }

    .dialog h2 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1.05;
    }

    .dialog p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .gameover {
      background: rgba(127, 29, 29, 0.88);
    }

    .gameover .dialog {
      border-color: rgba(254, 202, 202, 0.6);
      background: #7f1d1d;
    }

    .inventory-list {
      display: grid;
      gap: 10px;
      margin: 16px 0;
      text-align: left;
    }

    .inv-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
    }

    .hidden {
      display: none !important;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes idle {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes blink {
      50% {
        filter: brightness(1.55);
      }
    }

    @keyframes coinBump {
      50% {
        transform: scale(1.12);
      }
    }

    @keyframes greenFlash {
      50% {
        box-shadow: 0 0 0 999px rgba(34, 197, 94, 0.18), 0 18px 42px var(--shadow);
      }
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      20% {
        transform: translateX(-9px);
      }
      40% {
        transform: translateX(9px);
      }
      60% {
        transform: translateX(-6px);
      }
      80% {
        transform: translateX(6px);
      }
    }

    @keyframes criticalFlash {
      50% {
        box-shadow: 0 0 0 999px rgba(239, 68, 68, 0.2), 0 18px 42px var(--shadow);
      }
    }

    @keyframes popText {
      0% {
        opacity: 0;
        transform: scale(0.66) rotate(-5deg);
      }
      26% {
        opacity: 1;
        transform: scale(1.08) rotate(2deg);
      }
      100% {
        opacity: 0;
        transform: scale(1.32) rotate(0);
      }
    }

    @media (max-width: 760px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .arena,
      .answers,
      .items {
        grid-template-columns: 1fr;
      }

      .fighter {
        min-height: 220px;
      }

      .sprite {
        min-height: 112px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>打怪 RPG 進階版</h1>
      <button type="button" onclick="window.location.href='../大冒險地圖/index.html'" style="background:#7f1d1d; white-space:nowrap;">← 回到大地圖</button>
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <div class="source-badge" id="sourceBadge">題庫：載入中</div>
        <div class="coin-counter" id="coinCounter">💰 <span id="coins">0</span></div>
      </div>
    </header>

    <section class="loading panel" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <div>
        <h2>讀取題庫中...</h2>
        <p id="loadStatus">正在連線 Google Sheets CSV</p>
      </div>
    </section>

    <section class="battle hidden" id="battle">
      <div class="arena">
        <article class="fighter panel player" id="playerPanel">
          <div class="fighter-name"><span>我方 🧙 巫師</span><span id="playerHpText">100 / 100</span></div>
          <div class="sprite">🧙</div>
          <div class="hp-wrap">
            <div class="hp-row"><span>HP</span><span id="playerHpPercent">100%</span></div>
            <div class="hp-bar"><div class="hp-fill" id="playerHpFill"></div></div>
          </div>
        </article>

        <article class="fighter panel monster" id="monsterPanel">
          <div class="fighter-name"><span id="monsterName">第 1 關 野狼</span><span id="monsterHpText">100 / 100</span></div>
          <div class="sprite" id="monsterSprite">🐺</div>
          <div class="hp-wrap">
            <div class="hp-row"><span>HP</span><span id="monsterHpPercent">100%</span></div>
            <div class="hp-bar"><div class="hp-fill" id="monsterHpFill"></div></div>
          </div>
        </article>
      </div>

      <section class="question-panel panel" id="questionPanel">
        <div class="level-line">
          <span id="levelText">第 1 / 5 關</span>
          <span id="inventoryText">🧪 0　💎 0　🛡 0</span>
        </div>
        <div class="question" id="questionText"></div>
        <div class="answers" id="answers"></div>
      </section>

      <div class="message" id="message"></div>
      <div class="toolbar">
        <button type="button" class="bag-button" id="bagButton">🎒 背包</button>
      </div>
    </section>

    <section class="shop" id="shop">
      <div class="shop-inner panel">
        <div class="shop-title">
          <span>商店</span>
          <span id="shopInfo">下一關準備</span>
        </div>
        <div class="items" id="shopItems"></div>
        <div class="toolbar" style="margin-top: 16px;">
          <button type="button" class="continue" id="continueButton">前往下一關</button>
        </div>
      </div>
    </section>
  </main>

  <div class="critical-text" id="criticalText">CRITICAL!</div>

  <div class="overlay" id="bagOverlay" role="dialog" aria-modal="true" aria-labelledby="bagTitle">
    <div class="dialog">
      <h2 id="bagTitle">🎒 背包</h2>
      <div class="inventory-list" id="bagList"></div>
      <button type="button" id="closeBagButton">關閉</button>
    </div>
  </div>

  <div class="overlay" id="winOverlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="dialog">
      <h2 id="winTitle">通關成功</h2>
      <p id="winText"></p>
      <button type="button" id="restartWinButton">重新開始</button>
    </div>
  </div>

  <div class="overlay gameover" id="gameOverOverlay" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
    <div class="dialog">
      <h2 id="gameOverTitle">Game Over</h2>
      <p>HP 只剩 1 又被擊倒，冒險暫時結束。</p>
      <button type="button" id="restartLoseButton">重新開始</button>
    </div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvolGccJldegUHhivLhLHhZIsc6PS-nikhrHZOxn_-8XcNvMjuao-dspERvlZ-Q83Uv56fmXK_KOzD/pub?output=csv";

    const FALLBACK_QUESTIONS = [
      { question: "「一鳴驚人」的意思最接近哪一項？", answer: "平時默默無聞，突然有驚人表現", wrong: ["每天唱歌很大聲", "看見人就驚慌", "一個人鳴叫"] },
      { question: "下列哪一個成語可形容次數很多？", answer: "三番五次", wrong: ["一字千金", "畫龍點睛", "風花雪月"] },
      { question: "「亡羊補牢」強調的是什麼？", answer: "犯錯後及時補救", wrong: ["逃跑最快", "養羊致富", "把門關起來"] },
      { question: "「刻舟求劍」常用來比喻什麼？", answer: "不知情勢已變", wrong: ["雕刻技術很好", "劍術高明", "坐船旅行"] },
      { question: "「畫龍點睛」比喻什麼？", answer: "在關鍵處點明要旨", wrong: ["畫畫速度很快", "龍的眼睛很大", "把事情弄複雜"] },
      { question: "「狐假虎威」中的「假」意思是什麼？", answer: "借用", wrong: ["虛假", "假日", "如果"] },
      { question: "「胸有成竹」表示做事前如何？", answer: "已有把握或計畫", wrong: ["心裡很緊張", "胸口受傷", "拿著竹子"] },
      { question: "下列何者可形容文字價值極高？", answer: "一字千金", wrong: ["一毛不拔", "一日千里", "一言不發"] }
    ];

    const MONSTERS = [
      { emoji: "🐺", name: "野狼", hp: 100 },
      { emoji: "🦂", name: "毒蠍", hp: 100 },
      { emoji: "👹", name: "惡鬼", hp: 100 },
      { emoji: "🐲", name: "巨龍", hp: 100 },
      { emoji: "👑", name: "魔王", hp: 100 }
    ];

    const SHOP_ITEMS = [
      { key: "potion", icon: "🧪", name: "紅藥水", effect: "補 50 HP，戰鬥中也能用。", price: 30 },
      { key: "crystal", icon: "💎", name: "攻擊水晶", effect: "下一題答對暴擊，怪物 -50 HP。", price: 40 },
      { key: "charm", icon: "🛡", name: "救命符", effect: "HP 歸零自動復活，剩 1 滴 HP。", price: 80 }
    ];

    const state = {
      questions: [],
      usedQuestionIndexes: [],
      level: 0,
      playerHp: 100,
      monsterHp: 100,
      coins: 0,
      correctCount: 0,
      potionUsed: 0,
      inventory: { potion: 0, crystal: 0, charm: 0 },
      currentQuestion: null,
      locked: false,
      diedAtOneHp: false,
      questionSource: "載入中"
    };

    const $ = (selector) => document.querySelector(selector);
    const loading = $("#loading");
    const loadStatus = $("#loadStatus");
    const battle = $("#battle");
    const shop = $("#shop");
    const sourceBadge = $("#sourceBadge");
    const coinCounter = $("#coinCounter");
    const coins = $("#coins");
    const playerPanel = $("#playerPanel");
    const monsterPanel = $("#monsterPanel");
    const playerHpText = $("#playerHpText");
    const monsterHpText = $("#monsterHpText");
    const playerHpPercent = $("#playerHpPercent");
    const monsterHpPercent = $("#monsterHpPercent");
    const playerHpFill = $("#playerHpFill");
    const monsterHpFill = $("#monsterHpFill");
    const monsterName = $("#monsterName");
    const monsterSprite = $("#monsterSprite");
    const levelText = $("#levelText");
    const inventoryText = $("#inventoryText");
    const questionPanel = $("#questionPanel");
    const questionText = $("#questionText");
    const answers = $("#answers");
    const message = $("#message");
    const criticalText = $("#criticalText");
    const shopItems = $("#shopItems");
    const shopInfo = $("#shopInfo");
    const continueButton = $("#continueButton");
    const bagOverlay = $("#bagOverlay");
    const bagList = $("#bagList");
    const winOverlay = $("#winOverlay");
    const winText = $("#winText");
    const gameOverOverlay = $("#gameOverOverlay");

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && quoted && next === '"') {
          cell += '"';
          i += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(cell.trim());
          cell = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") {
            i += 1;
          }
          row.push(cell.trim());
          if (row.some(Boolean)) {
            rows.push(row);
          }
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell.trim());
      if (row.some(Boolean)) {
        rows.push(row);
      }

      return rows;
    }

    function rowsToQuestions(rows) {
      return rows.slice(1).map((row) => {
        const [question, a, b, c, d] = row;
        const wrong = [b, c, d].filter((option) => option && option !== "空");
        if (!question || !a || a === "空") {
          return null;
        }
        return { question, answer: a, wrong };
      }).filter((item) => item && item.wrong.length > 0);
    }

    async function fetchCsvText(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error("CSV response was not OK");
      }
      return response.text();
    }

    async function loadQuestions() {
      try {
        const text = await fetchCsvText(CSV_URL);
        const parsed = rowsToQuestions(parseCsv(text));
        if (parsed.length < 5) {
          throw new Error("CSV questions are not enough");
        }
        state.questions = parsed;
        state.questionSource = "Google Sheets";
        loadStatus.textContent = `已從 Google Sheets 載入 ${parsed.length} 題，準備開戰`;
      } catch (directError) {
        try {
          loadStatus.textContent = "直接讀取被擋，改用同一份 CSV 的備援讀取方式";
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(CSV_URL)}`;
          const text = await fetchCsvText(proxyUrl);
          const parsed = rowsToQuestions(parseCsv(text));
          if (parsed.length < 5) {
            throw new Error("Proxy CSV questions are not enough");
          }
          state.questions = parsed;
          state.questionSource = "Google Sheets";
          loadStatus.textContent = `已從你的 Google Sheets 載入 ${parsed.length} 題，準備開戰`;
        } catch (proxyError) {
          state.questions = FALLBACK_QUESTIONS;
          state.questionSource = "內建範例";
          loadStatus.textContent = "Google Sheets 仍讀不到，暫時改用內建範例題庫";
        }
      }

      window.setTimeout(startGame, 650);
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function startGame() {
      state.level = 0;
      state.playerHp = 100;
      state.monsterHp = 100;
      state.coins = 0;
      state.correctCount = 0;
      state.potionUsed = 0;
      state.inventory = { potion: 0, crystal: 0, charm: 0 };
      state.usedQuestionIndexes = [];
      state.locked = false;
      state.diedAtOneHp = false;
      loading.classList.add("hidden");
      shop.classList.remove("show");
      winOverlay.classList.remove("show");
      gameOverOverlay.classList.remove("show");
      battle.classList.remove("hidden");
      setupLevel();
    }

    function setupLevel() {
      const monster = MONSTERS[state.level];
      state.monsterHp = monster.hp;
      state.locked = false;
      state.diedAtOneHp = state.playerHp === 1;
      monsterName.textContent = `第 ${state.level + 1} 關 ${monster.name}`;
      monsterSprite.textContent = monster.emoji;
      message.textContent = "";
      battle.classList.remove("hidden");
      shop.classList.remove("show");
      render();
      nextQuestion();
    }

    function pickQuestion() {
      if (state.usedQuestionIndexes.length >= state.questions.length) {
        state.usedQuestionIndexes = [];
      }

      const available = state.questions
        .map((_, index) => index)
        .filter((index) => !state.usedQuestionIndexes.includes(index));
      const index = available[randInt(0, available.length - 1)];
      state.usedQuestionIndexes.push(index);
      const raw = state.questions[index];
      const optionSet = new Set([raw.answer, ...raw.wrong].filter((option) => option && option !== "空"));
      const fillerPool = shuffle(state.questions.flatMap((item) => [item.answer, ...item.wrong]))
        .filter((option) => option && option !== "空" && option !== raw.answer);

      for (const option of fillerPool) {
        if (optionSet.size >= 4) {
          break;
        }
        optionSet.add(option);
      }

      const options = [...optionSet].slice(0, 4);
      return { ...raw, options: shuffle(options) };
    }

    function nextQuestion() {
      state.currentQuestion = pickQuestion();
      state.locked = false;
      questionText.textContent = state.currentQuestion.question;
      answers.innerHTML = "";
      state.currentQuestion.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
        button.dataset.option = option;
        button.addEventListener("click", () => answer(option, button));
        answers.appendChild(button);
      });
      render();
    }

    function answer(option, button) {
      if (state.locked) {
        return;
      }
      state.locked = true;
      const correct = option === state.currentQuestion.answer;
      answers.querySelectorAll("button").forEach((btn) => {
        btn.disabled = true;
        if (btn.dataset.option === state.currentQuestion.answer) {
          btn.classList.add("correct");
        }
      });

      if (correct) {
        button.classList.add("correct");
        handleCorrect();
      } else {
        button.classList.add("wrong");
        handleWrong();
      }
    }

    function handleCorrect() {
      const critical = state.inventory.crystal > 0;
      const damage = critical ? 50 : 25;
      state.monsterHp = Math.max(0, state.monsterHp - damage);
      state.correctCount += 1;
      addCoins(5);
      message.textContent = critical ? "攻擊水晶發動，造成 50 傷害！" : "答對！巫師攻擊造成 25 傷害。";
      questionPanel.classList.add("flash-green");

      if (critical) {
        state.inventory.crystal -= 1;
        monsterPanel.classList.add("critical-flash");
        criticalText.classList.add("show");
        window.setTimeout(() => criticalText.classList.remove("show"), 720);
      }

      window.setTimeout(() => {
        questionPanel.classList.remove("flash-green");
        monsterPanel.classList.remove("critical-flash");
        afterAction();
      }, 650);
      render();
    }

    function handleWrong() {
      state.playerHp = Math.max(0, state.playerHp - 25);
      message.textContent = `答錯了！正確答案是「${state.currentQuestion.answer}」。`;
      playerPanel.classList.add("shake");
      window.setTimeout(() => {
        playerPanel.classList.remove("shake");
        checkDeathOrContinue();
      }, 2000);
      render();
    }

    function afterAction() {
      if (state.monsterHp <= 0) {
        defeatMonster();
      } else {
        nextQuestion();
      }
    }

    function checkDeathOrContinue() {
      if (state.playerHp > 0) {
        nextQuestion();
        return;
      }

      if (state.inventory.charm > 0) {
        state.inventory.charm -= 1;
        state.playerHp = 1;
        state.diedAtOneHp = true;
        message.textContent = "救命符發動！HP 回到 1。";
        render();
        window.setTimeout(nextQuestion, 900);
        return;
      }

      if (!state.diedAtOneHp) {
        state.playerHp = 1;
        state.diedAtOneHp = true;
        message.textContent = "被擊倒了，重來該關，HP 懲罰為 1。";
        render();
        window.setTimeout(setupLevel, 1400);
      } else {
        gameOverOverlay.classList.add("show");
      }
    }

    function defeatMonster() {
      const bonus = randInt(20, 50);
      addCoins(bonus);
      message.textContent = `擊敗怪物！額外獲得 ${bonus} 金幣。`;
      render();
      window.setTimeout(() => {
        if (state.level === MONSTERS.length - 1) {
          showWin();
        } else {
          openShop();
        }
      }, 950);
    }

    function openShop() {
      battle.classList.add("hidden");
      shop.classList.add("show");
      shopInfo.textContent = `第 ${state.level + 2} 關前整備`;
      renderShop();
    }

    function renderShop() {
      shopItems.innerHTML = "";
      SHOP_ITEMS.forEach((item) => {
        const card = document.createElement("article");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-icon">${item.icon}</div>
          <h3>${item.name}</h3>
          <p>${item.effect}</p>
          <button type="button" class="buy" ${state.coins < item.price ? "disabled" : ""}>
            ${item.price} 金幣購買
          </button>
        `;
        card.querySelector("button").addEventListener("click", () => buyItem(item));
        shopItems.appendChild(card);
      });
    }

    function buyItem(item) {
      if (state.coins < item.price) {
        return;
      }
      state.coins -= item.price;
      state.inventory[item.key] += 1;
      render();
      renderShop();
    }

    function continueNextLevel() {
      state.level += 1;
      setupLevel();
    }

    function addCoins(amount) {
      state.coins += amount;
      coins.textContent = state.coins;
      coinCounter.classList.remove("bump");
      void coinCounter.offsetWidth;
      coinCounter.classList.add("bump");
    }

    function usePotion() {
      if (state.inventory.potion <= 0 || state.playerHp >= 100) {
        return;
      }
      state.inventory.potion -= 1;
      state.potionUsed += 1;
      state.playerHp = Math.min(100, state.playerHp + 50);
      message.textContent = "使用紅藥水，HP 回復 50。";
      render();
      renderBag();
    }

    function renderBag() {
      bagList.innerHTML = `
        <div class="inv-row">
          <span>🧪 紅藥水：${state.inventory.potion}</span>
          <button type="button" id="usePotionButton" ${state.inventory.potion <= 0 || state.playerHp >= 100 ? "disabled" : ""}>使用</button>
        </div>
        <div class="inv-row"><span>💎 攻擊水晶：${state.inventory.crystal}</span><span>答對自動發動</span></div>
        <div class="inv-row"><span>🛡 救命符：${state.inventory.charm}</span><span>死亡自動發動</span></div>
      `;
      $("#usePotionButton").addEventListener("click", usePotion);
    }

    function showWin() {
      localStorage.setItem("cert_warrior", "勇者之印");
      winText.innerHTML = `答對題數：<strong>${state.correctCount}</strong><br>剩餘金幣：<strong>${state.coins}</strong><br>使用紅藥水：<strong>${state.potionUsed}</strong> 瓶`;
      winOverlay.classList.add("show");
    }

    function renderHp(fill, text, percentText, hp, maxHp) {
      const percent = Math.max(0, Math.round((hp / maxHp) * 100));
      fill.style.width = `${percent}%`;
      fill.classList.toggle("low", percent < 50 && percent >= 20);
      fill.classList.toggle("critical", percent < 20 && percent > 0);
      text.textContent = `${hp} / ${maxHp}`;
      percentText.textContent = `${percent}%`;
    }

    function render() {
      coins.textContent = state.coins;
      sourceBadge.textContent = `題庫：${state.questionSource}`;
      renderHp(playerHpFill, playerHpText, playerHpPercent, state.playerHp, 100);
      renderHp(monsterHpFill, monsterHpText, monsterHpPercent, state.monsterHp, 100);
      levelText.textContent = `第 ${state.level + 1} / ${MONSTERS.length} 關`;
      inventoryText.textContent = `🧪 ${state.inventory.potion}　💎 ${state.inventory.crystal}　🛡 ${state.inventory.charm}`;
    }

    continueButton.addEventListener("click", continueNextLevel);
    $("#bagButton").addEventListener("click", () => {
      renderBag();
      bagOverlay.classList.add("show");
    });
    $("#closeBagButton").addEventListener("click", () => bagOverlay.classList.remove("show"));
    $("#restartWinButton").addEventListener("click", startGame);
    $("#restartLoseButton").addEventListener("click", startGame);

    loadQuestions();
  </script>
</body>
</html>
