<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朝代配對</title>
  <style>
    :root {
      --ink: #160f0d;
      --panel: #241613;
      --panel-soft: #34211b;
      --gold: #d8b35a;
      --gold-bright: #ffe29a;
      --paper: #f4e2bd;
      --paper-deep: #e2c989;
      --red: #a72d25;
      --red-bright: #e44b3d;
      --green: #328a51;
      --green-soft: #173c2c;
      --text: #fff6df;
      --muted: #d8c697;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: "Noto Serif TC", "PMingLiU", serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(216, 179, 90, 0.18), transparent 28rem),
        radial-gradient(circle at 86% 12%, rgba(167, 45, 37, 0.2), transparent 24rem),
        linear-gradient(135deg, #120c0a 0%, #281611 45%, #0f0a09 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(216, 179, 90, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(216, 179, 90, 0.04) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent);
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 0 22px;
      border-bottom: 1px solid rgba(216, 179, 90, 0.38);
    }

    h1 {
      margin: 0;
      color: var(--gold-bright);
      font-size: clamp(2rem, 5vw, 4.2rem);
      letter-spacing: 0;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
      line-height: 1.05;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 1rem;
      white-space: nowrap;
    }

    .seal {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border: 2px solid var(--red-bright);
      color: #ffd4c8;
      background: #761f1a;
      box-shadow: inset 0 0 0 4px rgba(255, 226, 154, 0.08), 0 10px 20px var(--shadow);
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 20px;
      padding-top: 22px;
      align-items: start;
    }

    .dynasty-board,
    .events-panel {
      border: 2px solid rgba(216, 179, 90, 0.72);
      background: rgba(22, 15, 13, 0.76);
      box-shadow: 0 22px 46px var(--shadow), inset 0 0 0 1px rgba(255, 226, 154, 0.08);
    }

    .dynasty-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 16px;
    }

    .dynasty-card {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 220px;
      border: 2px solid var(--gold);
      background:
        linear-gradient(135deg, rgba(244, 226, 189, 0.96), rgba(224, 192, 122, 0.92)),
        var(--paper);
      color: #32170d;
      box-shadow: inset 0 0 0 4px rgba(86, 42, 18, 0.08), 0 12px 24px rgba(0, 0, 0, 0.2);
    }

    .dynasty-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(91, 50, 19, 0.24);
      font-size: clamp(2.15rem, 5vw, 3.2rem);
      font-weight: 900;
      line-height: 1;
    }

    .count {
      min-width: 2.5rem;
      padding: 4px 8px;
      border: 1px solid rgba(91, 50, 19, 0.28);
      background: rgba(255, 246, 223, 0.45);
      color: #6d2b1e;
      font-size: 0.9rem;
      text-align: center;
    }

    .drop-zone {
      display: flex;
      align-content: flex-start;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 142px;
      padding: 12px;
      transition: background-color 0.16s ease, box-shadow 0.16s ease;
    }

    .drop-zone.drag-over {
      background: rgba(255, 226, 154, 0.38);
      box-shadow: inset 0 0 0 2px rgba(109, 43, 30, 0.24);
    }

    .events-panel {
      position: sticky;
      top: 18px;
      padding: 14px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--gold-bright);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .remaining {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .event-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      min-height: 180px;
    }

    .event-card {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 10px 12px;
      border: 2px solid var(--red);
      background:
        linear-gradient(135deg, rgba(69, 31, 24, 0.96), rgba(29, 17, 15, 0.98)),
        var(--panel);
      color: var(--text);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.25);
      cursor: grab;
      user-select: none;
      transition: transform 0.16s ease, border-color 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
      touch-action: none;
    }

    .event-card:active {
      cursor: grabbing;
    }

    .event-card:hover {
      border-color: var(--red-bright);
      transform: translateY(-2px);
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.32);
    }

    .event-card.dragging {
      opacity: 0.46;
    }

    .event-card.wrong {
      animation: wrongFlash 0.3s ease;
    }

    .event-card.matched {
      width: auto;
      min-height: 38px;
      max-width: 100%;
      padding: 7px 9px;
      border-color: #6ed08f;
      background:
        linear-gradient(135deg, rgba(50, 138, 81, 0.96), rgba(23, 60, 44, 0.98)),
        var(--green-soft);
      color: #f2fff4;
      cursor: default;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
      font-size: 0.88rem;
    }

    .event-card.matched:hover {
      transform: none;
      border-color: #6ed08f;
    }

    .icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      background: rgba(255, 226, 154, 0.12);
      border: 1px solid rgba(255, 226, 154, 0.22);
      font-size: 1.25rem;
      line-height: 1;
    }

    .event-card.matched .icon {
      width: 26px;
      height: 26px;
      font-size: 1rem;
    }

    .event-text {
      overflow-wrap: anywhere;
      line-height: 1.35;
      font-weight: 700;
    }

    .success-overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(9, 6, 5, 0.72);
      z-index: 10;
    }

    .success-overlay.show {
      display: grid;
      animation: goldenGlow 1.1s ease both;
    }

    .success-box {
      width: min(520px, 100%);
      border: 3px solid var(--gold-bright);
      background:
        linear-gradient(135deg, rgba(66, 35, 18, 0.98), rgba(129, 43, 30, 0.95)),
        var(--panel-soft);
      box-shadow: 0 0 42px rgba(255, 226, 154, 0.45), 0 24px 56px rgba(0, 0, 0, 0.45);
      padding: 28px;
      text-align: center;
    }

    .success-title {
      margin: 0 0 10px;
      color: var(--gold-bright);
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1.05;
    }

    .success-text {
      margin: 0 0 22px;
      color: #fff2c8;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    button {
      min-height: 46px;
      padding: 10px 18px;
      border: 2px solid var(--gold-bright);
      background: #811f19;
      color: #fff4d2;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.28);
    }

    button:hover {
      background: #a72d25;
    }

    @keyframes wrongFlash {
      0%,
      100% {
        transform: translateX(0);
        border-color: var(--red);
      }
      25% {
        transform: translateX(-8px);
        border-color: #ffebe6;
        background: #8f1e19;
      }
      50% {
        transform: translateX(8px);
        border-color: var(--red-bright);
      }
      75% {
        transform: translateX(-5px);
        border-color: #ffebe6;
      }
    }

    @keyframes goldenGlow {
      0% {
        box-shadow: inset 0 0 0 0 rgba(255, 226, 154, 0);
      }
      38% {
        box-shadow: inset 0 0 110px 30px rgba(255, 226, 154, 0.38);
      }
      100% {
        box-shadow: inset 0 0 24px 4px rgba(255, 226, 154, 0.18);
      }
    }

    @media (max-width: 860px) {
      .app {
        width: min(100% - 22px, 720px);
        padding-top: 14px;
      }

      header {
        align-items: start;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .events-panel {
        position: static;
        order: -1;
      }

      .event-list {
        display: flex;
        overflow-x: auto;
        min-height: 92px;
        padding-bottom: 8px;
        scroll-snap-type: x proximity;
      }

      .events-panel .event-card {
        flex: 0 0 min(78vw, 290px);
        scroll-snap-align: start;
      }

      .dynasty-board {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .dynasty-card {
        min-height: 184px;
      }
    }

    @media (max-width: 460px) {
      .stats {
        align-items: start;
        flex-direction: column;
      }

      .seal {
        width: 46px;
        height: 46px;
        font-size: 0.9rem;
      }

      .success-box {
        padding: 22px 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>朝代配對</h1>
      </div>
      <button type="button" onclick="window.location.href='../大冒險地圖/index.html'" style="background:#7f1d1d; border-color:#ffe29a; white-space:nowrap;">← 回到大地圖</button>
      <div class="stats" aria-live="polite">
        <div class="seal">史<br>學</div>
        <div>
          <div>嘗試次數：<strong id="attempts">0</strong></div>
          <div>已完成：<strong id="matchedCount">0</strong> / <span id="totalCount">0</span></div>
        </div>
      </div>
    </header>

    <section class="layout" aria-label="朝代配對遊戲">
      <div class="dynasty-board" id="dynastyBoard" aria-label="朝代掉落區"></div>

      <aside class="events-panel" aria-label="事件卡區">
        <div class="panel-title">
          <span>事件卡</span>
          <span class="remaining">剩餘 <strong id="remainingCount">0</strong></span>
        </div>
        <div class="event-list" id="eventList"></div>
      </aside>
    </section>
  </main>

  <div class="success-overlay" id="successOverlay" role="dialog" aria-modal="true" aria-labelledby="successTitle">
    <div class="success-box">
      <h2 class="success-title" id="successTitle">通關成功</h2>
      <p class="success-text">你完成所有朝代事件配對。總嘗試次數：<strong id="finalAttempts">0</strong></p>
      <button type="button" id="restartButton">再玩一次</button>
    </div>
  </div>

  <script>
    const dynasties = [
      { id: 1, name: "秦" },
      { id: 2, name: "漢" },
      { id: 3, name: "唐" },
      { id: 4, name: "宋" },
      { id: 5, name: "明" },
      { id: 6, name: "清" }
    ];

    const events = [
      { id: "e1", dynasty_id: 1, text: "統一六國", icon: "⚔️" },
      { id: "e2", dynasty_id: 1, text: "修築萬里長城", icon: "🧱" },
      { id: "e3", dynasty_id: 1, text: "焚書坑儒", icon: "🔥" },
      { id: "e4", dynasty_id: 2, text: "張騫通西域", icon: "🐪" },
      { id: "e5", dynasty_id: 2, text: "文景之治", icon: "📜" },
      { id: "e6", dynasty_id: 2, text: "罷黜百家獨尊儒術", icon: "📖" },
      { id: "e7", dynasty_id: 3, text: "貞觀之治", icon: "👑" },
      { id: "e8", dynasty_id: 3, text: "安史之亂", icon: "💥" },
      { id: "e9", dynasty_id: 3, text: "玄奘西行取經", icon: "🧘" },
      { id: "e10", dynasty_id: 4, text: "王安石變法", icon: "📜" },
      { id: "e11", dynasty_id: 4, text: "岳飛抗金", icon: "🗡️" },
      { id: "e12", dynasty_id: 5, text: "鄭和下西洋", icon: "⛵" },
      { id: "e13", dynasty_id: 5, text: "永樂大典編成", icon: "📚" },
      { id: "e14", dynasty_id: 6, text: "鴉片戰爭", icon: "💣" },
      { id: "e15", dynasty_id: 6, text: "康熙盛世", icon: "🌅" },
      { id: "e16", dynasty_id: 6, text: "辛亥革命終結", icon: "🏛️" }
    ];

    const dynastyBoard = document.querySelector("#dynastyBoard");
    const eventList = document.querySelector("#eventList");
    const attemptsEl = document.querySelector("#attempts");
    const matchedCountEl = document.querySelector("#matchedCount");
    const totalCountEl = document.querySelector("#totalCount");
    const remainingCountEl = document.querySelector("#remainingCount");
    const successOverlay = document.querySelector("#successOverlay");
    const finalAttemptsEl = document.querySelector("#finalAttempts");
    const restartButton = document.querySelector("#restartButton");

    let attempts = 0;
    let matched = 0;
    let draggedCard = null;

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function createEventCard(event) {
      const card = document.createElement("div");
      card.className = "event-card";
      card.id = event.id;
      card.draggable = true;
      card.dataset.dynastyId = String(event.dynasty_id);
      card.innerHTML = `
        <span class="icon" aria-hidden="true">${event.icon}</span>
        <span class="event-text">${event.text}</span>
      `;

      card.addEventListener("dragstart", (eventObject) => {
        if (card.classList.contains("matched")) {
          eventObject.preventDefault();
          return;
        }
        draggedCard = card;
        card.classList.add("dragging");
        eventObject.dataTransfer.effectAllowed = "move";
        eventObject.dataTransfer.setData("text/plain", card.id);
      });

      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
        draggedCard = null;
      });

      return card;
    }

    function updateStats() {
      attemptsEl.textContent = attempts;
      matchedCountEl.textContent = matched;
      remainingCountEl.textContent = events.length - matched;
    }

    function setDynastyCount(zone) {
      const dynastyCard = zone.closest(".dynasty-card");
      const count = dynastyCard.querySelector(".count");
      count.textContent = `${zone.children.length} 件`;
    }

    function handleCorrectDrop(card, zone) {
      card.classList.add("matched");
      card.draggable = false;
      zone.appendChild(card);
      setDynastyCount(zone);
      matched += 1;
      updateStats();

      if (matched === events.length) {
        localStorage.setItem("cert_dynasty", "朝代之印");
        finalAttemptsEl.textContent = attempts;
        window.setTimeout(() => {
          successOverlay.classList.add("show");
        }, 180);
      }
    }

    function handleWrongDrop(card) {
      card.classList.remove("wrong");
      void card.offsetWidth;
      card.classList.add("wrong");
      window.setTimeout(() => {
        card.classList.remove("wrong");
      }, 300);
    }

    function createDynastyCard(dynasty) {
      const card = document.createElement("article");
      card.className = "dynasty-card";
      card.innerHTML = `
        <div class="dynasty-name">
          <span>${dynasty.name}</span>
          <span class="count">0 件</span>
        </div>
        <div class="drop-zone" data-dynasty-id="${dynasty.id}" aria-label="${dynasty.name}朝事件掉落區"></div>
      `;

      const zone = card.querySelector(".drop-zone");

      zone.addEventListener("dragover", (event) => {
        event.preventDefault();
        zone.classList.add("drag-over");
      });

      zone.addEventListener("dragleave", () => {
        zone.classList.remove("drag-over");
      });

      zone.addEventListener("drop", (event) => {
        event.preventDefault();
        zone.classList.remove("drag-over");
        const cardId = event.dataTransfer.getData("text/plain");
        const targetCard = draggedCard || document.getElementById(cardId);

        if (!targetCard || targetCard.classList.contains("matched")) {
          return;
        }

        attempts += 1;

        if (targetCard.dataset.dynastyId === zone.dataset.dynastyId) {
          handleCorrectDrop(targetCard, zone);
        } else {
          handleWrongDrop(targetCard);
          updateStats();
        }
      });

      return card;
    }

    function renderGame() {
      attempts = 0;
      matched = 0;
      draggedCard = null;
      dynastyBoard.innerHTML = "";
      eventList.innerHTML = "";
      successOverlay.classList.remove("show");
      totalCountEl.textContent = events.length;

      dynasties.forEach((dynasty) => {
        dynastyBoard.appendChild(createDynastyCard(dynasty));
      });

      shuffle(events).forEach((event) => {
        eventList.appendChild(createEventCard(event));
      });

      updateStats();
    }

    restartButton.addEventListener("click", renderGame);
    renderGame();
  </script>
</body>
</html>
